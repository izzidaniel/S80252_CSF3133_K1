
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1> Tajuk laman web</h1>
        <span> slogan laman web di sini </span>
    </div>

    <div>
        <form oninput="z.value=parseInt(x.value)">
             Email <input type="email" name="email"> <br><br>

             Date: <input type="date" name="date"><br><br>
             
             satisfaction: <input id="x" type="range" min="0" max="100" step="1" value="0">
             <output name="z" for="x">0</output><br><br>

             <input type="submit" name="submit">
        </form>
    </div><br>

    <div>
        <form oninput="total.value=parseInt(num1.value) + parseInt(num2.value)">
            number 1: <input id="num1" type="number" value="0"><br>
            number 2: <input id="num2" type="number" value="0">
            
            total = <output name="total" for="num1 num2">0</output>
        </form><br>

        <footer>
            Website ini adalah hak milik IZZI DANIEL &#169
        </footer>
    </div>
</body>
</html>
