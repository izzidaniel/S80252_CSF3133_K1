<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeric input validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .from-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            padding: 8px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
        </style>


</head>
<body>
    <h2>Numeric Input Validation</h2>

    <form name="numericForm" onsubmit="return validateNumericInput()">
        <div class="form-group">
            <label for="age">Enter a number:</label>
            <input type="text" id="age" name="age" placeholder="Enter a number">
        </div><br>
        <button type="submit">Submit</button>
    </form>

    <script src="numeric-validation.js"></script>
    
</body>
</html>
