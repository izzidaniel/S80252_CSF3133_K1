<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First JS</title>
</head>
<body>
    <h2>What can javaScript Do?</h2>
    <p id="demo"><b>JavaScript can change HTML content.</b></p>
    
    <!--<button></button> buat button-->
    <!-- onclick bila ditekan-->
    <!--'document.getElementById("demo") cari element label demo-->
    <!--innerHTML tukar kandungan dalam demo jadi teks lain -->
    <button type="button" onclick="document.getElementById('demo').innerHTML = 'Hello JavaScript'">Click Me</button>
    <button type="button" onclick="document.getElementById('demo').innerHTML = 'Hello sayang'">Click Sayang</button>
    <button type="button" onclick='document.getElementById("demo").
    innerHTML = "Hello JavaScript"'>Click Me!</button>
</body>
</html>
