<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disable Right-Click</title>
    <script>
        // JavaScript to disable right-click

        /* addeventlistener tunggu tindakan dari user */
        document.addEventListener('contextmenu', function(event) {
            event.preventDefault(); // Prevent the default context menu from appearing
            alert('Right-click is disabled on this page.'); // Show an alert message
        })
        </script>
</head>
<body>
    <h2>Right-Click Disabled</h2>
    <p>Try right-clicking anywhere on this page to see the effect.</p>
    
</body>
</html>
